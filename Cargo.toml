[package]
name = "llm-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "CPU LLM inference engine: paged KV cache, continuous batching, prefix caching, int8 weights, OpenAI-style streaming server"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
fancy-regex = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
axum = "0.7"
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
proptest = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }

[profile.release]
debug = 1
